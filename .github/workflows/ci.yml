name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_POSTGRES_PRISMA_URL: postgresql://user:password@localhost:5432/db?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --import tsx scripts/check-env.ts --require-boot=DATABASE_URL_POSTGRES_PRISMA_URL,BETTER_AUTH_SECRET
        env:
          BETTER_AUTH_SECRET: ci-dummy-not-a-secret
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pg-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/postvia_test?sslmode=disable
      ABUSE_HASH_PEPPER: ci-test-pepper-not-a-secret
      ABUSE_ENFORCEMENT: enforce
      PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      # Single run: races are timing-sensitive, so repeat locally (see
      # docs/development.md) instead of tripling every CI run.
      - run: npm run test:pg

  # Post-build smoke: boot the production server against the throwaway
  # CI database and prove the liveness + auth entry points answer.
  # Read-only (GETs only, no seeded users, DB discarded with the job).
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postvia_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/postvia_smoke?sslmode=disable
      BETTER_AUTH_SECRET: ci-smoke-not-a-secret
      ABUSE_HASH_PEPPER: ci-test-pepper-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npm run build
      - run: |
          (npm run start -- --port 3100 & echo $! > server.pid)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/api/health && break || sleep 2
          done
          curl -sf http://localhost:3100/api/health | grep -q '"db":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/login)" = "200"
          kill "$(cat server.pid)"

  # Dependency audit always runs, but is temporarily non-blocking.
  # Known finding GHSA-ggr8-5vv4-36mx / CVE-2026-40345 lives in the transitive
  # devDependency chain prisma CLI -> @prisma/config -> deepmerge-ts < 8.0.0;
  # no stable Prisma release with the upstream fix exists yet (downgrade is
  # not an option). The finding is tracked, not ignored — continue-on-error
  # only stops it from failing the PR until the upstream fix lands.
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
