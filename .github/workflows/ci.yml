name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_POSTGRES_PRISMA_URL: postgresql://user:password@localhost:5432/db?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pg-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/postvia_test?sslmode=disable
      ABUSE_HASH_PEPPER: ci-test-pepper-not-a-secret
      ABUSE_ENFORCEMENT: enforce
      PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npm run test:pg
      - run: npm run test:pg
      - run: npm run test:pg

  # Dependency audit always runs, but is temporarily non-blocking.
  # Known finding GHSA-ggr8-5vv4-36mx / CVE-2026-40345 lives in the transitive
  # devDependency chain prisma CLI -> @prisma/config -> deepmerge-ts < 8.0.0;
  # no stable Prisma release with the upstream fix exists yet (downgrade is
  # not an option). The finding is tracked, not ignored — continue-on-error
  # only stops it from failing the PR until the upstream fix lands.
  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
